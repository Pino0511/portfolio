buildscript {
    dependencies {
        classpath group: "biz.aQute.bnd", name: "biz.aQute.bnd", version: "5.2.0"

        classpath(group: "com.liferay", name: "com.liferay.gradle.plugins.workspace", version: "10.1.1") {
            exclude group: "biz.aQute.bnd", module: "biz.aQute.bnd"
        }
    }

    repositories {
        mavenLocal()
        maven { url "https://repository-cdn.liferay.com/nexus/content/groups/public" }
        maven { url "https://repository.liferay.com/nexus/content/groups/public" }
    }
}

apply plugin: "com.liferay.workspace"